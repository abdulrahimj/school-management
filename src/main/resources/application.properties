spring.application.name=school-management

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ================================
#  JWT CONFIGURATION
# ================================
# Secret key for signing tokens (make it long random)
jwt.secret=mySecretKeyThatIsVeryLongAndSecureForJWTSigning2024SchoolApp

#Token expiration: 24 hours in milliseconds
# 86400000 = 24 * 60 * 60 * 1000
jwt.expiration = 86400000

# ===================================
# SWAGGER / SPRINGDOC SETTINGS
# ===================================

# Path where API docs are served
springdoc.api-docs.path=/v3/api-docs

# Path where Swagger UI is served
springdoc.swagger-ui.path=/swagger-ui.html

# Show all endpoints (including ones without @Operation)
springdoc.show-actuator=false

# Sort endpoints alphabetically
springdoc.swagger-ui.operations-sorter=alpha

# Sort tags alphabetically
springdoc.swagger-ui.tags-sorter=alpha

# Expand all sections by default
springdoc.swagger-ui.doc-expansion=none

# Cache: explicit in-memory (ConcurrentHashMap-based) cache manager.
# Not Redis yet - no Redis server required to run the app.
spring.cache.type=simple

# Redis config (kept for later - only used once spring-boot-starter-data-redis
# is added as a dependency and spring.cache.type is switched to redis)
#spring.data.redis.host=localhost
#spring.data.redis.port=6379

# ========================
# LOGGING CONFIGURATION
# ========================

# Set root log level for entire application
logging.level.root=INFO

# Set detailed DEBUG level only for our custom code
logging.level.com.school.school_management=DEBUG

# Silence noisy SQL queries if desired (or keep DEBUG to inspect)
logging.level.org.hibernate.SQL=DEBUG

# Name and location of the log file
logging.file.name=logs/school-app.log

# Rotate file when it reaches 10MB
logging.logback.rollingpolicy.max-file-size=10MB

# Keep history of log files for 30 days
logging.logback.rollingpolicy.max-history=30
